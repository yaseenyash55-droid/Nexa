name: NEXA Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-web:
    name: Backend & Web Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Run Backend & Web Unit Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_minimum_32_bytes_long_123456
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_minimum_32_bytes_123456
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Compile Production Bundles
        run: npm run build

  oracle-integration:
    name: Oracle Integration Suite (Optional)
    runs-on: ubuntu-latest
    needs: backend-and-web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Live Oracle Integration Tests
        run: |
          if [ -n "$ORACLE_CONNECT_STRING" ]; then
            npm run test:integration --workspace=server
          else
            echo "TEST_ORACLE_CONNECT_STRING secret is not configured. Skipping live integration tests."
          fi
        env:
          NODE_ENV: test
          RUN_ORACLE_INTEGRATION_TESTS: 'true'
          ORACLE_CONNECT_STRING: ${{ secrets.TEST_ORACLE_CONNECT_STRING }}
          ORACLE_DB_USER: ${{ secrets.TEST_ORACLE_USER }}
          ORACLE_DB_PASSWORD: ${{ secrets.TEST_ORACLE_PASSWORD }}
          JWT_SECRET: test_jwt_secret_key_minimum_32_bytes_long_123456
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_minimum_32_bytes_123456
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  android-native:
    name: Android Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests, Lint & Assemble Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload Android Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
