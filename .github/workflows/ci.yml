name: NEXA Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-server:
    name: Web & Server Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Verification
        run: npm run typecheck

      - name: ESLint Verification (Zero Warnings Enforced)
        run: npm run lint

      - name: Run Backend & Frontend Unit/Component Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_minimum_32_bytes_long_123456
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_minimum_32_bytes_123456
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Compile Production Bundles
        run: npm run build

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Test Suite
        run: npm run test:e2e

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  oracle-integration:
    name: Oracle Database Integration Suite
    runs-on: ubuntu-latest
    needs: web-and-server
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      DB_CONNECT_STRING: ${{ secrets['TEST_ORACLE_CONNECT_STRING'] }}
      DB_USER: ${{ secrets['TEST_ORACLE_USER'] }}
      DB_PASSWORD: ${{ secrets['TEST_ORACLE_PASSWORD'] }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Oracle Test Database Credentials
        id: check-creds
        run: |
          if [ -n "$DB_CONNECT_STRING" ] && [ -n "$DB_USER" ] && [ -n "$DB_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Oracle integration secrets are not configured. Integration tests will be explicitly skipped."
          fi

      - name: Execute Live Oracle Integration Suite
        if: steps.check-creds.outputs.configured == 'true'
        run: npm run test:integration --workspace=server
        env:
          NODE_ENV: test
          RUN_ORACLE_INTEGRATION_TESTS: 'true'
          JWT_SECRET: test_jwt_secret_key_minimum_32_bytes_long_123456
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_minimum_32_bytes_123456
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  android-native:
    name: Native Android Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests, Lint & Assemble Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload Android Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
